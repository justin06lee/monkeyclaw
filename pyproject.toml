[project]
name = "monkeyclaw"
version = "0.1.0"
description = "Continuous red-team + repro + blue-team loop targeting NemoClaw / OpenClaw deployments"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.4",
    "psutil>=6.0",
    "rich>=13.7",
    "uvicorn>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "watchdog>=4.0",
    "anthropic>=0.40",
    "websockets>=13.0",
    "cryptography>=43.0",
]

[project.scripts]
monkeyclaw = "infra.cli:main"
mc-mock-mcp = "infra.mock_mcp:main"
mc-mcp = "infra.mcp_server:main"
mc-orchestrator = "infra.orchestrator:main"
mc-index-codebase = "infra.codebase_indexer:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra", "interfaces", "red_team", "blue_team"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
