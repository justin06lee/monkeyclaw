# Default MonkeyClaw runtime config. Overrides via MC_CONFIG path or MC_* env vars.

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384

ideation:
  model: nvidia/nemotron-3-super-120b-a12b
  temperature: 0.7
  max_tokens_per_mode: 2000
  dedup_threshold: 0.92
  near_dup_threshold: 0.80
  retry_max: 3

# B9 — model tournament. When enabled, each listed entrant model also
# ideates every targeted zone; their ideas join the shared dedup/priority
# pool. Disabled by default — the single `ideation.model` path is used.
model_tournament:
  enabled: false
  entrants: []
  #   - role: red_ideation          # resolves model from models.roles
  #   - role: cyber_specialist      # optional diversity entrant
  #     provider: nvidia
  #     model: nvidia/some-cyber-specialist
  #     optional: true

lanes:
  # One lane per synthesized attack chain — 5 chains, 5 deep-dive agents.
  pool_size: 5
  lane_timeout_seconds: 1200
  max_turns: 50
  psutil_interval_seconds: 0.5
  min_turns_before_giveup: 8

judgment:
  tier2_zones: [PROMPT-INJ, SOCIAL-ENG, MEM-STATE, MEM-SHARED]
  tier2_model: nvidia/nemotron-3-super-120b-a12b
  tier2_confidence_threshold: 0.5

repro:
  replay_count: 5
  repro_rate_threshold: 0.5
  delta_debug_max_iterations: 30
  root_cause_severity_threshold: high
  cold_verify_max_attempts: 3
  code_graph:
    enabled: true
    max_hops: 6
    path_rank_weight: 0.5
    llm_conf_weight: 0.5

blue_team:
  patch_verify_max_attempts: 3
  auto_commit_patches: false
  high_severity_alt_count: 3

orchestrator:
  red_team_batch_size: 50
  regression_before_batch: true
  graceful_shutdown_timeout_s: 30
  persist_queue_state: true

notifications:
  # Supply the bot token + chat id at runtime (keeps secrets out of git):
  #   export MC_NOTIFICATIONS__TELEGRAM_BOT_TOKEN=<token from @BotFather>
  #   export MC_NOTIFICATIONS__TELEGRAM_CHAT_ID=<your chat id>
  telegram_bot_token: null
  telegram_chat_id: null
  webhook_urls: []
  # `info` so judges see a live feed: every confirmed vuln AND every
  # cycle-completion summary is pushed to Telegram.
  alert_severity_floor: info

logging:
  level: INFO
  file: logs/monkeyclaw.log
  rotate_max_bytes: 50000000
  rotate_backups: 14

storage:
  db_path: data/monkeyclaw.db
  backup_dir: data/backups
  backup_interval_minutes: 30

nemoclaw:
  repo_path: ~/NemoClaw
  cli_binary: nemoclaw
  version: alpha
  sandbox_create_timeout_s: 120
  default_policy_path: configs/default_policy.yaml
  default_agent_config_path: configs/default_agent.yaml
  monitored_paths:
    - /tmp/openshell
    - ~/.nemoclaw
  allowed_paths:
    - /tmp/openshell
  # Live `monkey-victim` sandbox.
  sandbox_name: monkey-victim
  # No-reset mode: nemoclaw v0.0.44 `snapshot create` fails on this CPU
  # sandbox, so leave clean_snapshot empty — lanes connect to the persistent
  # victim without per-lane snapshot restore/recover. Set this to a real
  # snapshot name once snapshots work to restore per-lane isolation.
  clean_snapshot: ""
  # Empty: this sandbox runs as a standalone docker container, not a k3s pod
  # inside a gateway container, so the docker-exec fs-diff path does not apply.
  # The monitoring harness falls back to host-path snapshots.
  gateway_container: ""

models:
  roles:
    cheap_extraction:
      provider: nvidia
      model: nvidia/nemotron-3-nano
    red_ideation:
      provider: nvidia
      model: nvidia/nemotron-3-super-120b-a12b
    red_code_ideation:
      provider: anthropic_or_openai
      model: frontier-coding
    red_execution:
      provider: nvidia
      model: nvidia/nemotron-3-super-120b-a12b
    semantic_judge:
      provider: nvidia
      model: nvidia/nemotron-3-super-120b-a12b
    semantic_judge_appeal:
      provider: anthropic_or_openai
      model: frontier-coding
    safety_judge:
      provider: nvidia
      model: nvidia/nemotron-content-safety-reasoning-4b
    mutation:
      provider: nvidia
      model: nvidia/nemotron-3-nano
    cold_verification:
      provider: nvidia
      model: nvidia/nemotron-3-nano
    summarization:
      provider: nvidia
      model: nvidia/nemotron-3-nano
    root_cause:
      provider: anthropic_or_openai
      model: frontier-coding
    patch_generation:
      provider: anthropic_or_openai
      model: frontier-coding
    test_generation:
      provider: anthropic_or_openai
      model: frontier-coding
    codex_code_work:
      provider: openai
      model: gpt-5.3-codex
  # Risk/complexity tiers — the routing policy maps a role to one of these.
  tiers:
    cheap:
      route: {provider: nvidia, model: nvidia/nemotron-3-nano}
    workhorse:
      route: {provider: nvidia, model: nvidia/nemotron-3-super-120b-a12b}
    heavy:
      route: {provider: nvidia, model: nvidia/nemotron-3-ultra}
    frontier:
      route: {provider: anthropic_or_openai, model: frontier-coding}
  # Role -> tier. safety_judge is omitted: it is a direct specialised route.
  policy:
    red_ideation: workhorse
    red_code_ideation: frontier
    red_execution: workhorse
    semantic_judge: workhorse
    semantic_judge_appeal: frontier
    mutation: cheap
    cold_verification: cheap
    summarization: cheap
    root_cause: frontier
    patch_generation: frontier
    test_generation: frontier
    cheap_extraction: cheap
    codex_code_work: frontier
  # Per-million-token USD prices for cost accounting.
  pricing:
    nvidia/nemotron-3-nano: {input_per_mtok_usd: 0.04, output_per_mtok_usd: 0.16}
    nvidia/nemotron-3-super-120b-a12b: {input_per_mtok_usd: 0.30, output_per_mtok_usd: 0.90}
    nvidia/nemotron-3-ultra: {input_per_mtok_usd: 0.90, output_per_mtok_usd: 2.70}
    nvidia/nemotron-content-safety-reasoning-4b: {input_per_mtok_usd: 0.02, output_per_mtok_usd: 0.08}
    frontier-coding: {input_per_mtok_usd: 3.00, output_per_mtok_usd: 15.00}
    gpt-5.3-codex: {input_per_mtok_usd: 3.00, output_per_mtok_usd: 15.00}

guardrails:
  artifact_dir: data/artifacts
  denied_host_paths:
    - ~/.ssh
    - ~/.aws
    - ~/.config/gcloud
    - /etc/shadow
  network_allowlist:
    default: [localhost, 127.0.0.1]
    analysis: [docs.anthropic.com, integrate.api.nvidia.com]
    setup: [registry.npmjs.org, pypi.org, files.pythonhosted.org, github.com]
  model_route_allowlist: [nvidia, openai, anthropic_or_openai]
  mcp_tool_allowlist: [argyph, github-readonly, docs-search]
  max_lanes_per_cycle: 64
  max_tokens_per_cycle: 5000000
  emergency_stop: false

code_context:
  backend: python   # set to 'argyph' to use the Argyph binary
  argyph_binary: null
